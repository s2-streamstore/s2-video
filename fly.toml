# fly.toml app configuration file generated for s2-video on 2026-03-05T03:06:33+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 's2-video'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# Matches the live machines (2026-11-12); a smaller size here would shrink them on deploy.
[[vm]]
  cpu_kind = 'shared'
  cpus = 8
  memory_mb = 5120
